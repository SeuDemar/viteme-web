<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 80" role="img" aria-label="Viteme">
  <defs>
    <linearGradient id="mar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34c6e4"/>
      <stop offset="0.5" stop-color="#0a84be"/>
      <stop offset="1" stop-color="#0a5a9a"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a78"/>
      <stop offset="1" stop-color="#f2574a"/>
    </linearGradient>
    <clipPath id="corpo"><rect x="4" y="10" width="88" height="62" rx="15"/></clipPath>
  </defs>
  <!-- envelope -->
  <rect x="4" y="10" width="88" height="62" rx="15" fill="url(#mar)"/>
  <!-- reflexo de vidro (Frutiger Aero) -->
  <g clip-path="url(#corpo)">
    <ellipse cx="48" cy="8" rx="58" ry="30" fill="#fff" opacity="0.22"/>
    <!-- dobras laterais do envelope -->
    <path d="M10 70 36 46M86 70 60 46" fill="none" stroke="#fff" stroke-opacity="0.3" stroke-width="3" stroke-linecap="round"/>
  </g>
  <rect x="4.75" y="10.75" width="86.5" height="60.5" rx="14.25" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="1.5"/>
  <!-- a aba do envelope é o V do Viteme -->
  <path d="M19 27 48 54 77 27" fill="none" stroke="#04406f" stroke-opacity="0.28" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 2.5)"/>
  <path d="M19 27 48 54 77 27" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- aviso de convite -->
  <circle cx="82" cy="15" r="10.5" fill="url(#coral)" stroke="#fff" stroke-width="3"/>
</svg>
