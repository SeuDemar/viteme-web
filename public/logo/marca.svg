<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 80" role="img" aria-label="Viteme">
  <defs>
    <linearGradient id="vidro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d3f0fb"/>
    </linearGradient>
    <linearGradient id="aro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34c6e4"/>
      <stop offset="1" stop-color="#0a6aa8"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a88"/>
      <stop offset="1" stop-color="#f2574a"/>
    </linearGradient>
    <clipPath id="corpo"><rect x="5" y="11" width="86" height="60" rx="15"/></clipPath>
  </defs>
  <!-- envelope de vidro -->
  <rect x="5" y="11" width="86" height="60" rx="15" fill="url(#vidro)"/>
  <g clip-path="url(#corpo)">
    <ellipse cx="48" cy="9" rx="56" ry="26" fill="#fff" opacity="0.7"/>
  </g>
  <rect x="5" y="11" width="86" height="60" rx="15" fill="none" stroke="url(#aro)" stroke-width="3"/>
  <!-- a aba do envelope é o V do Viteme, em coral -->
  <path d="M22 22 48 49 74 22" fill="none" stroke="url(#coral)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M26 23 48 45" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round"/>
  <!-- brilho -->
  <path d="M84 3 86 10 93 12 86 14 84 21 82 14 75 12 82 10Z" fill="#34c6e4"/>
</svg>
